workflows:
  react-native-ios:
    name: Valora iOS Build
    working_directory: ./packages/mobile
    environment:
      groups:
        - supabase
      node: 22
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Prebuild native iOS project
        script: npx expo prebuild --platform ios
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS app
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace")
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | head -1 | xargs)
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/**/*.app
