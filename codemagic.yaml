workflows:
  react-native-ios:
    name: Valora iOS Build
    working_directory: mobile
    environment:
      groups:
        - supabase
      node: 22
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Prebuild native iOS project
        script: npx expo prebuild --platform ios
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build iOS app
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace")
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "Valora" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        script: |
          mkdir -p build/ipa/Payload
          cp -r build/Build/Products/Release-iphoneos/Valora.app build/ipa/Payload/
          cd build/ipa
          zip -r ../../valora.ipa Payload
    artifacts:
      - valora.ipa
